# Weekly vulnerability audit. New advisories appear without a change in the
# repository, so a scheduled run finds them also when nobody opens a PR.
# CI runs the same audit on each PR.
name: Audit

on:
  schedule:
    # Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_ENABLE_TOOLS: go,osv-scanner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache_key_prefix: mise-v1-audit
      - run: mise run audit
