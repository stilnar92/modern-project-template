# Local environment like production (issues #24, #25).
# Start it with "mise run up". The settings come from the .env file in the repo root.
name: ${COMPOSE_PROJECT_NAME:-app}

x-core-env: &core-env
  APP_ENV: local
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SENTRY_DSN: ${SENTRY_DSN:-}
  DATABASE_URL: postgres://app_app:${APP_DB_PASSWORD}@postgres:5432/app?sslmode=disable
  SYSTEM_DATABASE_URL: postgres://app_system:${SYSTEM_DB_PASSWORD}@postgres:5432/app?sslmode=disable
  S3_ENDPOINT: http://s3:8333
  S3_ACCESS_KEY: local-access-key
  S3_SECRET_KEY: local-secret-key
  SMTP_ADDR: mailpit:1025

# One image for migrate, api and worker. "mise run up" sets VERSION from git.
x-core-image: &core-image
  image: ${COMPOSE_PROJECT_NAME:-app}-core:local
  build:
    context: ../core
    args:
      VERSION: ${VERSION:-dev}

# Logs rotate, so a long-running container does not fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SYSTEM_DB_PASSWORD: ${SYSTEM_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-54320}:5432
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    logging: *logging
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - 127.0.0.1:${S3_PORT:-8333}:8333
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8333/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    # The image has its own healthcheck.
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    logging: *logging
    ports:
      - 127.0.0.1:${SMTP_PORT:-1025}:1025

  migrate:
    <<: *core-image
    command: [/app/migrate, up]
    logging: *logging
    environment:
      <<: *core-env
      MIGRATE_DATABASE_URL: postgres://app_owner:${OWNER_DB_PASSWORD}@postgres:5432/app?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles: [tools]

  api:
    <<: *core-image
    command: [/app/api]
    restart: unless-stopped
    logging: *logging
    # Longer than the 10 s shutdown of the api, so Docker does not kill it in the middle.
    stop_grace_period: 15s
    environment:
      <<: *core-env
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    # The image has no shell: the api binary checks its own /healthz.
    healthcheck:
      test: [CMD, /app/api, -healthcheck]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    <<: *core-image
    command: [/app/worker]
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 15s
    environment: *core-env
    depends_on:
      postgres:
        condition: service_healthy
    # The worker answers /healthz on its metrics port while River runs.
    # "mise run up" waits for it, so a worker that does not start makes the
    # baseline red.
    healthcheck:
      test: [CMD, /app/worker, -healthcheck]
      interval: 3s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2.11.8-alpine
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - 127.0.0.1:${HTTP_PORT:-8088}:80
    depends_on: [api, mailpit, s3]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/caddy-health"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  s3data:
