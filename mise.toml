# Tool versions for local work and CI. Install them with: mise install
# Keep only [tools] here. Other sections need "mise trust" in each worktree.
# task lint:versions checks that go.mod, core/Dockerfile and the pnpm
# packageManager field use the same versions.
[tools]
go = "1.27.3"
node = "22.23.4"
pnpm = "10.23.0"
task = "3.54.0"
golangci-lint = "2.15.0"
gitleaks = "8.30.1"
lychee = "0.24.2"
osv-scanner = "2.7.0"
