packages:
  - apps/*
  - packages/*
  - e2e

# Telemetry script of a Prism dependency. Do not run it.
ignoredBuiltDependencies:
  - "@scarf/scarf"

# Security fixes for dependencies of dev tools (Prism, openapi-typescript,
# hey-api: its ref parser pins js-yaml 4.2.0).
# Their latest releases still pin the vulnerable versions. Remove an entry
# when the tool releases a version with the fix.
overrides:
  "lodash@<4.18.0": "^4.18.1"
  "uuid@<11.1.1": "^11.1.1"
  "minimatch@<11.0.1": "^11.0.1"
  "fast-xml-parser@<5.12.0": "^5.12.0"
  "js-yaml@>=4.0.0 <4.3.2": "^4.3.2"
  # astro 7.4.8 lets pnpm select the 2.0 betas of these peers, and the betas
  # crashes astro check. Keep the stable 1.x line until 2.0 is released.
  "@emnapi/runtime": "^1.11.3"
  "@emnapi/core": "^1.11.3"
