# Known vulnerabilities that we accept, each with a reason and an end date.
# mise run audit:deps uses this file. After ignoreUntil, the check fails again,
# so somebody looks at the finding again.

[[IgnoredVulns]]
id = "GHSA-qxc2-j82w-r537"
ignoreUntil = 2027-05-04
reason = """\
@faker-js/faker 5.5.3 comes only through the Prism mock server (dev tool), \
in postman-collection. postman-collection does not call helpers.fake, the \
vulnerable function. faker 8+ removes faker.address, which postman-collection \
reads at load time, so an override breaks Prism. The Dependabot alert is \
dismissed with the same reason."""

# --- Docs viewer (tools/docs-viewer, ADR 0016) ---------------------------
# VitePress 1.6.4 needs Vite 5. The fixes are in Vite 6 and later, and
# VitePress 2 is still an alpha release. The owner accepted these findings
# until the review date in tools/docs-viewer/README.md. The web workspace
# uses Vite 8, so these entries hide nothing there.

[[IgnoredVulns]]
id = "GHSA-4w7w-66w2-5vf9"
ignoreUntil = 2027-02-14
reason = """\
vite 5.4.21 in the docs viewer only (VitePress 1.x). It affects the dev \
server (mise run docs:dev), which listens on localhost and serves only the \
viewer and the published roots. mise run docs serves the static build."""

