reason = """\
picomatch <= 4.0.7 ReDoS, no fixed version yet. picomatch comes only \
through build and test tools (vite, vitest, astro, knip, chokidar). They \
match globs from our own config files, not user input, so the attack is \
not reachable. Update picomatch when a fix is out."""
